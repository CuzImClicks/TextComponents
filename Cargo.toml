[package]
name = "text_components"
description = "A Rust implementation of Minecraft's Text Components"
repository = "https://github.com/Steel-Foundation/TextComponents"
license = "GPL-3.0-or-later"
readme = "README.md"
version = "0.2.0"
edition = "2024"
exclude = ["examples/*"]
keywords = ["minecraft", "mc", "text_components", "pretty", "terminal"]
categories = [
  "internationalization",
  "localization",
  "text-processing",
  "value-formatting",
  "game-engines",
]

[workspace]
members = ["grammar", "macros"]

[workspace.lints.clippy]
single_call_fn = "allow"
multiple_inherent_impl = "allow"
shadow_unrelated = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
cargo_common_metadata = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
struct_field_names = "allow"
absolute_paths = "warn"
missing_const_for_fn = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
unwrap_used = { level = "warn", priority = -3 }

[lints]
workspace = true

[lib]

[features]
custom = []
nbt = []
serde = ["dep:serde"]
minimessage = ["dep:text_components_grammar", "text_components_grammar/render"]
macros = ["dep:text_components_macros"]
build = [
  "dep:heck",
  "dep:proc-macro2",
  "dep:quote",
  "dep:rustc-hash",
  "dep:serde_json",
]

[dependencies]
colored = "3.1"
rand = { version = "0.10", default-features = false, features = [
  "std",
  "thread_rng",
] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
simdnbt = "0.10"
# Build dependencies
heck = { version = "0.5.0", optional = true }
proc-macro2 = { version = "1.0", optional = true }
quote = { version = "1.0", optional = true }
rustc-hash = { version = "2.1", optional = true }
serde_json = { version = "1.0.149", optional = true }
uuid = { version = "1.23", features = ["v4", "serde"] }
supports-hyperlinks = "3.2.0"
text_components_grammar = { path = "grammar", version = "=0.2.0", optional = true }
text_components_macros = { path = "macros", version = "=0.2.0", optional = true }

[dev-dependencies]
chrono = "0.4"
criterion = { version = "0.7", features = ["html_reports"] }
serde_json = "1.0.149"
text_components_macros = { path = "macros" }
uuid = "1.23"

[[bench]]
name = "component"
harness = false

[[example]]
name = "serde"
required-features = ["serde"]
